<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fee Payment - Modern International School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<style>
  /* Small, page-specific layout — everything else reuses the
     app's existing design tokens/components from admin.css. */
  .pay-page {
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 60px;
    animation: fadeInPage 0.5s ease both;
  }
  .pay-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--purple-dark, #4a41d6);
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 18px;
  }
  .pay-card {
    background: #fff;
    border-radius: var(--radius-lg, 18px);
    box-shadow: var(--shadow-card, 0 4px 24px rgba(23,19,53,0.06));
    padding: 28px 24px;
    text-align: center;
    animation: slideUpFade 0.5s var(--transition-slow, 0.45s ease) both;
  }
  .pay-icon {
    width: 60px; height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--purple, #5b52ea), var(--purple-dark, #4a41d6));
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    margin: 0 auto 16px;
  }
  .pay-who { font-size: 13.5px; color: var(--text-muted, #8a8fa3); margin-bottom: 2px; }
  .pay-period { font-size: 16px; font-weight: 700; color: var(--text-dark, #1f2237); margin-bottom: 18px; }
  .pay-amount-label { font-size: 12px; color: var(--text-muted, #8a8fa3); text-transform: uppercase; letter-spacing: 0.4px; }
  .pay-amount { font-size: 40px; font-weight: 800; color: var(--text-dark, #1f2237); margin: 4px 0 22px; }
  .pay-amount-lock { font-size: 12px; color: var(--text-faint, #b4b8c9); margin-top: -14px; margin-bottom: 22px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-upi {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    background: linear-gradient(135deg, var(--purple, #5b52ea), var(--purple-dark, #4a41d6));
    color: #fff; border: none; border-radius: var(--radius-md, 12px);
    padding: 15px; font-size: 14.5px; font-weight: 700; font-family: inherit;
    cursor: pointer; margin-bottom: 14px;
    transition: transform var(--transition-fast, 0.18s ease), box-shadow var(--transition-fast, 0.18s ease);
  }
  .btn-upi:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover, 0 10px 30px rgba(91,82,234,0.16)); }
  .pay-divider {
    display: flex; align-items: center; gap: 10px;
    color: var(--text-faint, #b4b8c9); font-size: 11.5px; margin: 18px 0 14px;
  }
  .pay-divider .line { flex: 1; height: 1px; background: var(--border-color, #e7e8f1); }
  .pay-confirm-hint { font-size: 12.5px; color: var(--text-muted, #8a8fa3); margin-bottom: 14px; line-height: 1.5; }
  .btn-confirm-paid {
    width: 100%;
    background: #d97706; color: #fff; border: none; border-radius: var(--radius-md, 12px);
    padding: 15px; font-size: 14.5px; font-weight: 700; font-family: inherit;
    cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform var(--transition-fast, 0.18s ease), box-shadow var(--transition-fast, 0.18s ease);
  }
  .btn-confirm-paid:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(217,119,6,0.28); }
  .btn-confirm-paid:disabled { opacity: 0.6; cursor: default; transform: none; box-shadow: none; }
  .pay-cancel {
    display: block; text-align: center; margin-top: 18px;
    color: var(--text-muted, #8a8fa3); font-size: 13px; text-decoration: none;
  }
  .pay-state-msg {
    text-align: center; padding: 40px 10px; color: var(--text-muted, #8a8fa3); font-size: 14px;
  }
  .pay-state-msg i { font-size: 30px; display: block; margin-bottom: 12px; color: var(--purple, #5b52ea); }
</style>
</head>
<body>

<div class="pay-page">

  <a href="parent-dashboard.html" class="pay-back">
    <i class="fa-solid fa-arrow-left"></i> Dashboard par vaapas jaayein
  </a>

  <div id="payContent">
    <div class="pay-state-msg">
      <i class="fa-solid fa-spinner fa-spin"></i>
      Loading...
    </div>
  </div>

</div>

<script type="module" src="pay-fee.js?v=2"></script>
</body>
</html>
